{% extends "blog/base.html" %}

{% block title %}Delete Comment{% endblock %}
{% block layout_class %}layout layout--single{% endblock %}
{% block sidebar %}{% endblock %}

{% block content %}

<div class="form-card confirm-card">

    <div class="confirm-icon"><i class="bi bi-chat-square-x"></i></div>
    <h1>Delete this comment?</h1>

    <blockquote class="quote-box">{{ object.content }}</blockquote>

    <form method="post" class="form-actions form-actions--center">
        {% csrf_token %}
        <a class="btn btn-outline" href="{{ object.post.get_absolute_url }}">Cancel</a>
        <button class="btn btn-danger" type="submit">Yes, Delete</button>
    </form>

</div>

{% endblock %}
