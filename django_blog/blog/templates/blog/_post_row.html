{% load blog_extras %}
<article class="post-row">
    <a class="post-row-image" href="{{ post.get_absolute_url }}">
        <img src="{% post_image post 600 400 %}" alt="" loading="lazy">
    </a>

    <div>
        <div class="post-meta">
            {% for tag in post.tags.all|slice:":2" %}
                <a class="tag-label" href="{% url 'posts_under_tag' tag.name %}">{{ tag.name }}</a>
            {% endfor %}
            {% if post.tags.all %}<span class="sep"></span>{% endif %}
            <span>{{ post.published_date|date:"M d, Y" }}</span>
        </div>

        <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>

        <p class="excerpt">{{ post.content|truncatewords:28 }}</p>

        <a class="read-link" href="{{ post.get_absolute_url }}">
            <span class="circle"><i class="bi bi-arrow-right"></i></span>
            Read more
        </a>
    </div>
</article>
